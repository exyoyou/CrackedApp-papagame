    message PointerProperties {
        enum TouchDevice {
            // 未知
            TOOL_TYPE_UNKNOWN = 0;
            // 手指
            TOOL_TYPE_FINGER = 1;
            // 触控笔
            TOOL_TYPE_STYLUS = 2;
            // 鼠标
            TOOL_TYPE_MOUSE = 3;
            // 橡皮擦
            TOOL_TYPE_ERASER = 4;
        }
        optional int32 id               = 1;     // 触控点的表示,从0开始计数.0表示第一个按下的手指.
        optional TouchDevice type       = 2;     // 触控的设备.
        optional float pressure         = 3;     // 触控压感强度(0-1).
        optional float size             = 4;     // 触控面积(0-1),占触控采集设备面积的比率.
        optional float touch_major      = 5;     // 触摸面积椭圆的长轴
        optional float touch_minor      = 6;     // 触摸面积椭圆的短轴
        optional int32 x_pos            = 7;     // 基于屏幕的X坐标
        optional int32 y_pos            = 8;     // 基于屏幕的Y坐标
        optional float x_percent        = 9;     // 基于屏幕的X坐标占屏幕的百分比
        optional float y_percent        = 10;    // 基于屏幕的Y坐标占屏幕的百分比
    }
    message TouchEvent {
        optional int32 pointer_count                  = 1;   // 当前包含的触控点的数量
        repeated PointerProperties pointer_properties = 2;   // 触控的属性
    }

    // 跟触摸相关的数据
    // 1. 触摸的点击时
    // input_op为OP_TOUCH_POINT
    // input_state为OP_STATE_DOWN或OP_STATE_UP
    // value为发生事件手指的索引(比如value=1时,表示第一个手指按下或弹起)
    // touch_event为各手指头点的信息
    // 2. 触摸移动时
    // input_op为OP_TOUCH_MOVE
    // input_state无效
    // value无效
    // touch_event为各手指头点的信息
    // 3. 触摸取消
    // input_op为OP_TOUCH_CANCEL
    // input_state无效
    // value无效
    // touch_event为各手指头点的信息

    optional InputOP            input_op                    = 1;    // 操作，某键按下，鼠标移动等，用int类型代替枚举类型以允许未定义的操作代码
    optional InputState         input_state                 = 2;    // 状态，按下、抬起等
    optional int32              value                       = 3;    // 值，滚轮滚动3行等
    optional CoordinatePos      pos_cursor                  = 4;    // 坐标，光标移动位置
    optional CoordinatePos      pos_mouse                   = 5;    // 坐标，鼠标物理位置
    optional int32              op_device                   = 6;    // 操作设备，不存在时默认为标准鼠标、键盘、手柄
    optional int32              xinput_user_index           = 7;    // 单个客户端多个XBOX手柄，这里表示手柄的编号
    optional uint32             game_cursor_sync_seq_num    = 8;    // 服务端返回坐标序列号
    optional TouchEvent         touch_event                 = 9;    // 触摸点事件相关的数据
    optional PositionMode       pos_mode                    = 10;   // <废弃> 位移模式, 绝对/相对
    optional int32              serial_number               = 11;   // 序列号, 递增
    optional int64              timestamp                   = 12;   // 时间戳(微秒)
    optional int32              wheel                       = 13;   // 垂直滚动的行数
    optional int32              wheel_h                     = 14;   // 水平滚动的行数
    optional string             vendor                      = 15;   // 厂商标识(仅手柄输入需要)
}

message InputOPData {
    repeated OneInputOPData op_list                         = 1;    // 操作list，服务器顺序处理
    optional bool           handle_combo_key                = 2;    // [2021.12.13]暂时不处理此值, 统一由GS端xml来过滤组合键. [original]是否是组合键的标识
    optional uint32         op_tick                         = 99;   // 用来统计操控到视频帧返回延迟
}

// 描述：GS<->CLIENT
// 方向：GS<->CLIENT
// 请求或应答（A or R）: A
// 协议号: 0x
message GameSDKAction {
    optional int64 cid         = 1;
    optional string user_id    = 2;
    optional string sdk_action = 3; // 游戏通过sdk发给终端的action消息
}

// 描述：GS<->CLIENT
// 方向：GS<->CLIENT
// 请求或应答（A or R）: A
// 协议号: 0x
message GameSDKData {
    optional int64 cid         = 1;
    optional string user_id    = 2;
    optional string sdk_data   = 3; // 游戏通过sdk发给终端的消息(多为支付消息)
}

// 描述: 重置无操作计时器
// 方向: SDK --> GS
// 协议号: 1-7 (ENUM_MSG_GS_CLIENT_MA_USER_INPUT_MI_REST_NO_INPUT_TIMER)
message ResetNoInputTimer {
    optional int32 value = 1; // 保留字段
}

// 描述: 重置无操作计时响应
// 方向: GS --> SDK
// 协议号: 1-7 (ENUM_MSG_GS_CLIENT_MA_USER_INPUT_MI_REST_NO_INPUT_TIMER)
message RestNoInputTimer_R {
    optional int32      result   = 1;   // 重置结果; 0:成功; 1:失败
    optional string     msg      = 2;   // 描述
}

// 描述: 传送剪切板数据
// 方向: GS <--> SDK
// 协议号: 4-16 (ENUM_MSG_GS_CLIENT_MA_GAME_MI_CLIP_BOARD)
message ClipBoardData {
    optional bytes      data    = 1;    // 剪贴板数据
}

// 描述: SDK上传文件到GS实例
// 方向: SDK --> GS
// 协议号: 7-0 (ENUM_MSG_GS_CLIENT_MA_SERVICE_MI_UPLOAD_FILE)
message FileUpload {
    optional string     name          = 1;    // 文件名
    optional int32      type          = 2;    // 文件类型, 保留字段赋0
    optional string     md5           = 3;    // 文件MD5(留空或不传则不需校验完整性)
    optional int32      size          = 4;    // 文件总大小
    optional int32      total_blocks  = 5;    // 文件总块数
    optional int32      block_index   = 6;    // 当前分块号(从0开始)
    optional int32      block_size    = 7;    // 当前分块大小
    optional string     block_md5     = 8;    // 当前块的MD5
    optional bytes      block_data    = 9;    // 二进制块数据
    optional string     path          = 10;   // 文件相对路径(实例中相对于游戏根目录的相对路径)
}

// 描述: 文件上传结果
// 方向: GS --> SDK
// 协议号: 7-0 (ENUM_MSG_GS_CLIENT_MA_SERVICE_MI_UPLOAD_FILE)
message FileUpload_R {
    enum ErrorCode {
        SUCCESS                  = 0;
        CHECK_BLOCK_HASH_FAIL    = 1;    //  文件分片校验失败
        CHECK_FILE_HASH_FAIL     = 2;    //  文件校验失败
        PARSE_MSG_ERROR          = 3;
        UPLOAD_PATH_NOT_EXIST    = 4;
        DIRECTORY_PATH_INVALID   = 5;    // 目录路径不合法
        SAVE_FILE_ERROR          = 6;    // 文件保存失败
    }
    optional int32      code         = 1;   // 上传结果, 0:成功, 1：分片异常需要重新发送该分片  2:MD5校验失败需要重传整个文件（只有最后一个分片的响应才有机会是 2）
    optional string     msg          = 2;
    optional int32      ack_index    = 3;   //  确认应答分块
}

// 描述: SDK请求实例上指定文件的下载地址
// 方向: SDK --> GS
// 协议号: 7-1 (ENUM_MSG_GS_CLIENT_MA_SERVICE_MI_DOWNLOAD_FILE)
message FileDownload {
    optional string     name    = 1;
    optional int32      type    = 2;    // 现阶段传0
    optional string     path    = 3;    // 文件相对路径(相对于游戏根目录的相对路径)
}

// 描述: GS返回文件的下载地址(URL)
// 方向: GS --> SDK
// 协议号: 7-1 (ENUM_MSG_GS_CLIENT_MA_SERVICE_MI_DOWNLOAD_FILE)
message FileDownload_R {
    enum ErrorCode {
        SUCCESS                 = 0;
        NOT_FOUND               = 1;    // 文件不存在
        TIMEOUT                 = 2;    // 上传超时未返回
        PARSE_MSG_ERROR         = 3;    // 解析FileDownload协议失败
        DOWNLOAD_PATH_NOT_EXIST = 4;    // 配置的下载路径不存在
        GS_ERROR                = 5;    // GS内部错误
    }
    optional int32      code    = 1;    // 结果, 0:成功, 1:文件不存在, 2:超时失败
    optional string     msg     = 2;
    optional string     url     = 3;    // 图片下载地址
    optional int32      size    = 4;    // 大小
    optional int32      type    = 5;
    optional string     md5     = 6;    // 文件MD5
}

// 描述: SDK发送shell命令给实例
// 方向: SDK --> GS
// 协议号: 7-2 (ENUM_MSG_GS_CLIENT_MA_SERVICE_SHELL_COMMAND)
message ShellCommands {
    optional string content                 = 1; // Shell命令文本, UTF-8编码, 支持多行
}

// 描述: GS返回shell的执行结果
// 方向: GS --> SDK
// 协议号: 7-2 (ENUM_MSG_GS_CLIENT_MA_SERVICE_SHELL_COMMAND)
message ShellCommands_R {
    enum ShellExecResult {
        SUCCESS         = 0;
        PARSE_FAILED    = 1;
        EXECUTE_FAILED  = 2;
    }
    optional int32              result      = 1; // 执行结果, 参考 ShellExecResult
    optional string             output      = 2; // 执行命令的输出, UTF-8编码
}

// 描述：GS->CLIENT XINPUT下发通知
// 方向：GS->CLIENT
// 请求或应答（A or R）: A
// 协议号: 0x
message XInputMSG {
    // 通知类型
    enum MsgType {
        VIBRATION   = 1; // 震动
    }
    enum Vendor {
        XBOX        = 0;
        DS4         = 1;
    }

    optional int32 msg_type             = 1;    // 通知类型
    optional int32 user_index           = 2;    // 用户（手柄）编号
    optional int32 left_motor_speed     = 3;    // 左轴震动速度, 0~65535
    optional int32 right_motor_speed    = 4;    // 右轴震动速度
    optional float duration             = 5;    // 振动时长
    optional int32 vendor               = 6;    // 手柄厂商(多手柄时根据 厂商 + user_index 来判断需要振动的手柄)
}

// 描述：GS通知SDK打开/关闭麦克风
// 方向：GS->SDK
// 协议号: 1-6, ENUM_MSG_GS_CLIENT_MA_USER_INPUT_MI_MICPHONE
message MICStatus {
    enum Status {
        OPEN  = 0;
        CLOSE = 1;
    }
    optional Status mic_status          = 1;
}

// 描述: 游戏状态通知
// 方向: GS->SDK
// 协议号: 4-19, ENUM_MSG_GS_CLIENT_MA_GAME_MI_GAME_STATE
message GameState {
    enum StateType {
        INITIATE            = 1; // 游戏初始化, 初始化完成触发 GAME_READY 消息
        READY               = 2; // 游戏主窗口显示出来, 或切片准备完成
        FAILURE             = 3; // 游戏初始化失败, 超时或异常.
    }

    enum GameID {
        SLICE   = 0;    // 切片游戏
        STEAM   = 10;   // Steam
        OTHERS  = 100;  // 其它游戏(需要通过进程名称来判断)
    }

    optional int32  state_type  = 1; // 状态类型
    optional int32  game_id     = 2; // 游戏标识
    optional string exe_name    = 3; // 进程名称
    optional int32  error_code  = 4; // 错误码(GAME_FAILURE时有效)
    optional string error_msg   = 5; // 错误描述(GAME_FAILURE时有效)
    optional string ext_info     = 6; // 保留扩展字段

}