// GS_SDK.proto
// GamingServer与SDK之间的协议

syntax = "proto2";

package com.haima.hmcp.proto;

message GSStateNotice {
    enum GSStateType {
        // 大小写状态
        //  value: 0 大写未锁定
        //  value: 1 大写锁定
        CAPITAL_STATE                       = 1; // 大小写状态
        KEYBOARD_STYLE                      = 2; // 键盘样式 0:虚拟键盘 1:本地键盘
        CUT_VIRTUAL_GAME_PAD                = 3; // 切断虚拟手柄(VPAD)
        LINKED_VIRTUAL_GAME_PAD             = 4; // 连接虚拟手柄(VPAD)
        MAIN_CONTEXT_QUIT                   = 5; // 虚拟手柄的 main context (TV端) 退出了
        // GS调整游戏窗口大小
        // value:       1:开始调整 2:调整结束
        // extInfo:     分辨率
        GAME_WND_RESIZE                     = 6;
        GAME_START                          = 7; // 游戏启动通知, extInfo 指示 游戏包名
        GAME_STOP                           = 8; // 游戏退出通知, SDK端隐藏虚拟键位
        GAMEPAD_MODE                        = 9; // value值 0:手柄模式 1:鼠标模式
    }

    optional int32  type                    = 1; // 为避免enum Android 兼容性问题, type值使用GSStateType的值, 但此字段类型为int32
    optional int32  value                   = 2; // type的附加信息值
    optional string extInfo                 = 3; // 额外信息
}

message GSNotification {
    // 慎用enum Android Enum类型扩展有向前兼容问题
    enum GSNotifType {
        GAME_QUIT                           = 1;
        NO_INPUT_TIMEOUT                    = 2; // 长时间无操作
        GET_CONTROL                         = 3; // 获得控制权
        LOST_CONTROL                        = 4; // 失去控制权
        CAPITAL_STATE                       = 5; // 大写锁定状态 value:0 表示未锁定
    }

    enum GameQuitType {
        PROCESS_EXIT                        = 1; // 进程退出,value指示游戏退出码, value2指示崩溃次数
        OWNER_EXIT                          = 2; // 房主退出
    }

    optional GSNotifType type               = 1; // 通知类型
    optional int64 cid                      = 2; // cid
    optional string extInfo                 = 3; // 额外信息
    optional int32 value                    = 4; // 状态等信息
    optional int32 quit_type                = 5; // 游戏退出类型
}

// 客户端终端类型
// 终端类型标识
enum ClientType {
    NONE               = 0;
    PC                 = 1;
    ANDROID            = 2;
    WEB                = 3;
    IOS                = 4;
    MAC                = 5;
    IOS_H5             = 6;
    ANDROID_H5         = 7;
    TV                 = 8;
}

// 输入法类型
enum IMEType {
    IME_STANDARD        = 0;            // 标准键盘
    IME_PASSWORD        = 1;            // 密码键盘
    IME_NUMBER          = 2;            // 数字键盘
    IME_PHONE           = 3;            // 电话号码键盘
    IME_EMAILADDRESS    = 4;            // 电子邮件地址键盘
}

enum StatusType {
    STATUS_HIDE         = 0;            // 隐藏输入法
    STATUS_SHOW         = 1;            // 显示输入法
}

// 描述：GS->CLIENT 下线
// 方向：GS->CLIENT
// 请求或应答（A or R）: A
// 协议号：0x
message IMEStatus {
    optional StatusType status_type = 1;
    optional IMEType    ime_type    = 2;
}

// 描述: 手柄切换为鼠标模式
// 方向: SDK->GS
// 协议号: 3-6, ENUM_MSG_GS_CLIENT_MA_CURSOR_MI_GAMEPAD_MOUSE
message GamepadMouse {
    optional bool   mode_switch = 1;    // 手柄鼠标模式切换/切回, 值为false或不存在,GS什么也不做.
}


// 手柄状态
message GamepadState {
    enum State {
        UNPLUGGED   = 0;    // 手柄拔出
        PLUGGED     = 1;    // 手柄插入
    }
    optional int32          index           = 1;    // 手柄序号 0~3
    optional string         vendor          = 2;    // 手柄厂商, 各端根据自己能拿到信息发上来,GS来判断是什么类型手柄.
    optional State          state           = 3;    // 手柄状态
}

// 描述：CLIENT->GS
// 方向：CLIENT->GS
// 请求或应答（A or R）: R
// 协议号: 0x
message IMEStatusNotify {
    optional ClientType     terminal_type   = 1;
    optional StatusType     status_type     = 2;
    optional GamepadState   gamepad_state   = 3;
}

// 描述：CLIENT->GS 发送的汉字或字符
// 方向：CLIENT->GS
// 请求或应答（A or R）: A
// 协议号: 1-2, ENUM_MSG_GS_CLIENT_MA_USER_INPUT_MI_STRING
message InputMethodChData {
    optional bytes input_buf    = 1;
}

// 描述：GS->CLIENT 发送鼠标位置
// 方向：GS->CLIENT
// 请求或应答（A or R）: A
// 协议号: 0x
message GameCursor {
    enum CursorStyle {
        CURSOR_DEFAULT        = 0;
        CURSOR_CUSTOM         = 1;
        CURSOR_NONE           = 2;      // 不显示鼠标ICON
        CURSOR_APPSTARTING    = 32650; // Standard arrow and small hourglass
        CURSOR_ARROW          = 32512; // Standard arrow
        CURSOR_CROSS          = 32515; // Crosshair
        CURSOR_HAND           = 32649; // Hand
        CURSOR_HELP           = 32651; // Arrow and question mark
        CURSOR_IBEAM          = 32513; // I-beam
        CURSOR_ICON           = 32641; // Obsolete for applications marked version 4.0 or later.
        CURSOR_NO             = 32648; // Slashed circle
        CURSOR_SIZE           = 32640; // Obsolete for applications marked version 4.0 or later. Use IDC_SIZEALL.
        CURSOR_SIZEALL        = 32646; // Four-pointed arrow pointing north, south, east, and west
        CURSOR_SIZENESW       = 32643; // Double-pointed arrow pointing northeast and southwest
        CURSOR_SIZENS         = 32645; // Double-pointed arrow pointing north and south
        CURSOR_SIZENWSE       = 32642; // Double-pointed arrow pointing northwest and southeast
        CURSOR_SIZEWE         = 32644; // Double-pointed arrow pointing west and east
        CURSOR_UPARROW        = 32516; // Vertical arrow
        CURSOR_WAIT           = 32514; // Hourglass
    }

    message CursorFrame {
        optional uint32 step_frame                = 1;    // 帧索引
        optional CoordinatePos cursor_hot_spot    = 2;    // 光标实际具体坐标（点击生效点，比如光标图的左上角）
        optional bytes  frame_data                = 3;    // cursor的bmp数据
    }


    message GameCursorFrameData {
        optional uint32 frame_rate                        = 1;    // 一帧显示时长
        repeated CursorFrame cursor_frames                = 2;    // 光标帧数据
    }

    optional bool show_or_hide                          = 1;    // 是否显示
    optional CoordinatePos cursor_pos                   = 2;    // 重置光标位置
    // repeated DynamicCursorDataSingleFrame cursor_frames = 3;    // 光标帧数据,*弃用
    optional uint32 game_cursor_sync_seq_num            = 4;    // 服务端返回坐标序列号
    optional CursorStyle cursor_style                   = 5;    // 光标样式
    optional GameCursorFrameData game_cursor_data       = 6;    // 代替上面的cursor_frames
    optional CoordinatePos icon_cursor_hot_spot         = 7;    // 系统光标hotspot,或者自定义光标的第一帧hotspot（点击生效点，比如光标图的左上角）
    optional uint32 cursor_width                        = 8;
    optional uint32 cursor_height                       = 9;
}

// 描述：GS->CLIENT 发送音频数据
// 方向：GS->CLIENT
// 请求或应答（A or R）: A
// 协议号: 0x
message GameAudioData {
    repeated bytes audio_data   = 1;    // 有可能一次性发送多个音频片段
}


// 坐标位置
message CoordinatePos {
    optional int32 x   = 1;
    optional int32 y   = 2;
}


