name: Build & Release APK

# push 事件只运行“被 push 的那个分支里”的本 workflow 文件,
# 所以每个版本分支都必须包含本文件,push 后才会自动打包。
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # master / 纯文档分支没有 apktool.yml,直接跳过打包
      - name: Detect apktool project
        id: guard
        run: |
          if [ -f apktool.yml ]; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
            echo "本分支含反编译源码,开始打包。"
          else
            echo "build=no" >> "$GITHUB_OUTPUT"
            echo "本分支(${{ github.ref_name }})无 apktool.yml,跳过打包。"
          fi

      - name: Set up JDK 17
        if: steps.guard.outputs.build == 'yes'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download apktool & signer
        if: steps.guard.outputs.build == 'yes'
        run: |
          mkdir -p tools
          curl -fsSL -o tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -fsSL -o tools/uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Build APK (apktool)
        if: steps.guard.outputs.build == 'yes'
        run: |
          mkdir -p build
          java -jar tools/apktool.jar b . -o build/app-unsigned.apk --use-aapt2

      - name: Decode keystore
        if: steps.guard.outputs.build == 'yes'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > build/release.jks

      - name: Sign APK (uber-apk-signer)
        if: steps.guard.outputs.build == 'yes'
        run: |
          java -jar tools/uber-apk-signer.jar \
            --apks build/app-unsigned.apk \
            --ks build/release.jks \
            --ksAlias "${{ secrets.KEY_ALIAS }}" \
            --ksPass "${{ secrets.KEYSTORE_PASSWORD }}" \
            --ksKeyPass "${{ secrets.KEY_PASSWORD }}" \
            --out build/signed \
            --overwrite

      - name: Collect single APK
        if: steps.guard.outputs.build == 'yes'
        run: |
          mkdir -p out
          SIGNED=$(ls build/signed/*.apk | head -1)
          cp "$SIGNED" "out/papagame-${{ github.ref_name }}.apk"
          ls -l out

      # tag = 分支名;同名资产覆盖,保证每个分支 Release 只有一个包
      - name: Create / update Release
        if: steps.guard.outputs.build == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            自动构建的改机 APK(分支 `${{ github.ref_name }}`,提交 ${{ github.sha }})。
          files: out/papagame-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
